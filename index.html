<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A snowglobe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="title">
    <h1>A SNOWGLOBEUUUH </h1>
    <p>Just click on it to make it shake lol.</p>
    </header>
    <main>
      <section class="globe-card">
         <div class="globe" id="globe">
          <img class="globe shaking" src="snowglobe.png" alt="a snowglobe" />
        </div>
          <button id="shake">shake the globe</button>
        <p class="message" id="message">press the button and see what settles</p>
      </section>
    </main>
    <footer>
      <p>made by me, in the snow</p>
    </footer>
  </body>
</html>
